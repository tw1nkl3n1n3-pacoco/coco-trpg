  const g=gmKey(sc),c=SCC[sc.id];
  const list=gmFirst(sc.sp,g);
  const zero=c?list.filter(p=>p.k!==g&&!(c[p.k]>0)).length:0;
  return `<div class="tip" style="margin-bottom:8px">↑↓로 순서를 바꾸면 로그 화면의 숫자키 순서도 바뀌어요. 대사가 하나도 없는 발언자는 🗑로 지울 수 있어요. GM은 늘 맨 앞이에요.</div>
  <div class="roster mg"><span></span><span class="h">발언자</span><span class="h">등장인물</span><span class="h" style="text-align:right">대사</span><span></span>
  ${list.map((p,i)=>{const n=c?(c[p.k]||0):null;const isG=p.k===g;
    return `<span class="dot" style="--c:${fixC(p.c)}"></span>
    <span>${isG?gmTag+" ":""}<b style="${n===0?"color:var(--faint)":""}">${esc(p.name)}</b></span>
    <span style="color:var(--dim);font-size:13.5px">${esc(p.ch||(isG?"게임 마스터":""))}</span>
    <span class="cnum">${n===null?"…":n}</span>
    <span class="mgb">${isG?"":`<button class="ghost" data-mv="${p.k}" data-d="-1" title="위로" ${i<=(g?1:0)?"disabled":""}>↑</button><button class="ghost" data-mv="${p.k}" data-d="1" title="아래로" ${i===list.length-1?"disabled":""}>↓</button><button class="ghost" data-spdel="${p.k}" title="${n===0?"지우기":"대사가 있어서 못 지워요 (로그 화면에서 다른 발언자로 옮긴 뒤 지울 수 있어요)"}" ${n===0?"":"disabled"}>🗑</button>`}</span>`;}).join("")}
  </div>
  ${zero?`<button class="ghost" id="spzero" style="margin-top:8px">대사 없는 발언자 ${zero}명 한꺼번에 지우기</button>`:""}`;
}
function bindSpManage(sc){
  if(!S.canWrite||!sc)return;
  if(!SCC[sc.id]&&!SCC["_l"+sc.id]){SCC["_l"+sc.id]=1;loadScenCounts(sc).then(()=>{delete SCC["_l"+sc.id];if(S.cid===sc.id&&!S.scEdit)render();}).catch(()=>{delete SCC["_l"+sc.id];});}
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.mv,d=+b.dataset.d,g=gmKey(sc);
    const arr=gmFirst(sc.sp,g).slice();const i=arr.findIndex(x=>x.k===k),j=i+d;
    if(j<0||j>=arr.length||arr[j].k===g)return;
    [arr[i],arr[j]]=[arr[j],arr[i]];const order=arr.map(x=>x.k);sc.sp=arr;
    mutateScen(sc.id,L=>{const pos=new Map(order.map((k,i)=>[k,i]));L.sp=[...L.sp.filter(p=>pos.has(p.k)).sort((a,b)=>pos.get(a.k)-pos.get(b.k)),...L.sp.filter(p=>!pos.has(p.k))];});render();
  });
  const del=ks=>{mutateScen(sc.id,L=>{L.sp=L.sp.filter(x=>!ks.includes(x.k));});render();toast(ks.length>1?`${ks.length}명 지웠어요`:"지웠어요");};
  document.querySelectorAll("[data-spdel]").forEach(b=>b.onclick=()=>{const p=sc.sp.find(x=>x.k===b.dataset.spdel);if(p)confirmBox(`'${p.name}'을(를) 발언자 목록에서 지울까요?`,"지우기",()=>del([p.k]));});
  const z=$("#spzero");if(z)z.onclick=()=>{const c=SCC[sc.id]||{},g=gmKey(sc);const ks=sc.sp.filter(p=>p.k!==g&&!(c[p.k]>0)).map(p=>p.k);confirmBox(`대사가 하나도 없는 발언자 ${ks.length}명을 지울까요?`,"지우기",()=>del(ks));};
}
// 녹음 목록을 다 받아온 뒤에만 대사 수를 세요 (빈 목록으로 세면 모두 0이 돼요)
function sessionsReady(id){return S.canAdmin?!!SUB.sessData.all:!!SUB.sessData[id];}
// 수정 창에서 바꾼 부분만 최신 시나리오에 적용 (다른 사람이 그 사이에 바꾼 건 그대로 둬요)
function mergeScenEdit(L,base,d){
  ["name","system","summary"].forEach(f=>{if((d[f]||"")!==(base[f]||""))L[f]=d[f];});
  if(JSON.stringify(d.aliases||[])!==JSON.stringify(base.aliases||[]))L.aliases=d.aliases;
  if((d.gm||null)!==(base.gm||null)){if(d.gm)L.gm=d.gm;else delete L.gm;}
  const bk=new Map((base.sp||[]).map(p=>[p.k,p])),dk=new Map((d.sp||[]).map(p=>[p.k,p]));
  let arr=(L.sp||[]).filter(p=>!(bk.has(p.k)&&!dk.has(p.k)));
  (d.sp||[]).forEach(p=>{const b=bk.get(p.k)||{},l=arr.find(x=>x.k===p.k);if(!l)return;["name","ch","c"].forEach(f=>{if((p[f]||"")!==(b[f]||""))l[f]=p[f];});});
  if((d.sp||[]).map(p=>p.k).join()!==(base.sp||[]).map(p=>p.k).join()){
    const pos=new Map(d.sp.map((p,i)=>[p.k,i]));
    arr=[...arr.filter(p=>pos.has(p.k)).sort((a,b)=>pos.get(a.k)-pos.get(b.k)),...arr.filter(p=>!pos.has(p.k))];
  }
  L.sp=arr;
}
function shareUrl(id){return location.origin+location.pathname+"#c-"+id;}
function bindScen(){
  bindPartEdit();renderAuth();
  {const sc0=scenById(S.cid);if(sc0&&S.canWrite&&sessionsReady(sc0.id)&&!SCC[sc0.id]&&!SCC["_l"+sc0.id]){SCC["_l"+sc0.id]=1;loadScenCounts(sc0).then(()=>{delete SCC["_l"+sc0.id];if(S.cid===sc0.id){if(S.scEdit){const pl=window.__scPull;pl&&pl();}render();}}).catch(()=>{delete SCC["_l"+sc0.id];});}}
  const uf=$("#unlockf");if(uf){const inp=$("#unlockpw");setTimeout(()=>inp.focus(),0);uf.onsubmit=async ev=>{ev.preventDefault();const pw=inp.value.trim();if(!pw)return;const msg=$("#unlockmsg");msg.textContent="확인하는 중…";
    try{await unlockScen(S.cid,pw);msg.textContent="열렸어요!";}catch(e){msg.textContent=e&&e.code==="permission-denied"?"비밀번호가 틀렸어요.":"열지 못했어요: "+(e.code||e.message);}};}
  const scx=scenById(S.cid);
  const cs=$("#copyshare");if(cs)cs.onclick=async()=>{const t=`[${scx.name}] TRPG 로그\n${shareUrl(scx.id)}\n비밀번호: ${S.secrets[scx.id]}`;try{await navigator.clipboard.writeText(t);toast("복사했어요. 친구들에게 붙여넣어 보내면 돼요");}catch(e){toast("복사가 막혔어요");}};
  const rg=$("#regenpw");if(rg)rg.onclick=()=>confirmBox("비밀번호를 새로 만들까요? 예전 비밀번호로 연 사람은 모두 다시 잠겨요.","새로 만들기",async()=>{try{await S.db.doc("secrets/"+scx.id).set({pw:genPw()});toast("새 비밀번호를 만들었어요");}catch(e){toast("바꾸지 못했어요");}});
  const b=$("#scback");if(b)b.onclick=()=>{location.hash="";};
  const e=$("#scedit");if(e)e.onclick=()=>{S.scEdit=true;render();};
  if(!S.scEdit)return;
  const sc=scenById(S.cid);if(!sc){S.scEdit=false;return;}
  const d=S.scDraft;
  const pull=()=>{d.name=$("#e-name").value.trim()||d.name;d.system=$("#e-sys").value.trim();d.summary=$("#e-sum").value.replace(/\s+$/,"");
    document.querySelectorAll("[data-nm]").forEach(i=>{const v=i.value.trim();if(v)d.sp[+i.dataset.nm].name=v;});
    document.querySelectorAll("[data-ch]").forEach(i=>{d.sp[+i.dataset.ch].ch=i.value.trim();});
    const g=document.querySelector("[data-gm]:checked");if(g){if(g.dataset.gm)d.gm=g.dataset.gm;else delete d.gm;}};
  document.querySelectorAll("[data-sw]").forEach(btn=>btn.onclick=()=>{pull();const p=d.sp[+btn.dataset.sw];p.c=COLORS[(COLORS.indexOf(p.c)+1)%COLORS.length];render();});
  window.__scPull=pull;
  document.querySelectorAll("[data-emv]").forEach(btn=>btn.onclick=()=>{pull();const i=+btn.dataset.emv,j=i+(+btn.dataset.d);if(j<0||j>=d.sp.length)return;[d.sp[i],d.sp[j]]=[d.sp[j],d.sp[i]];render();});
  document.querySelectorAll("[data-edel]").forEach(btn=>btn.onclick=()=>{pull();const p=d.sp[+btn.dataset.edel];if(!p)return;d.sp=d.sp.filter(x=>x!==p);if(d.gm===p.k)delete d.gm;render();});
  const ez=$("#ezero");if(ez)ez.onclick=()=>{pull();const c=SCC[sc.id]||{};d.sp=d.sp.filter(p=>p.k===d.gm||c[p.k]>0);render();};
  document.querySelectorAll(".sc-page textarea").forEach(t=>{const fit=()=>{t.style.height="auto";t.style.height=Math.max(140,t.scrollHeight+4)+"px";};fit();t.oninput=fit;});
  document.querySelector("[data-x]").onclick=()=>{S.scEdit=false;S.scDraft=null;render();};
  document.querySelector("[data-ok]").onclick=async()=>{
    pull();
    const old=sc.name;
    const other=findScen(d.name);
    if(d.name!==old&&other&&other.id!==sc.id){toast("같은 이름의 시나리오가 이미 있어요. 합치려면 아래 '다른 시나리오와 합치기'를 써 주세요",3500);return;}
    const mine=S.sessions.filter(x=>info(x).scen===old);
    if(d.name!==old){d.aliases=[...new Set([...(d.aliases||[]),old])].filter(a=>a!==d.name);}
    const base=S.scBase||clone(sc),dd=clone(d);
    S.scEdit=false;S.scDraft=null;S.scBase=null;render();
    await mutateScen(sc.id,L=>mergeScenEdit(L,base,dd));
    if(d.name!==old){
      for(const s of mine){
        try{await retry(()=>S.db.doc("sessions/"+s.id).update({scen:d.name}));}catch(e){writeFail(e);}
        await sleep(120);
      }
    }
    toast("저장했어요");
  };
  const mg=$("#mgo");if(mg)mg.onclick=()=>{
    const to=scenById($("#mto").value);if(!to){toast("합칠 시나리오를 골라 주세요");return;}
    confirmBox(`'${sc.name}'을(를) '${to.name}'(으)로 합칠까요? '${sc.name}'은(는) 목록에서 사라지고 녹음은 '${to.name}' 아래로 옮겨가요.`,"합치기",()=>mergeScen(sc,to));
  };
  const del=$("#scdel");if(del)del.onclick=()=>confirmBox(`'${sc.name}' 시나리오와 개요를 지울까요?`,"삭제",async()=>{S.scEdit=false;location.hash="";try{await retry(()=>S.db.doc("scenarios/"+sc.id).delete());}catch(e){toast("지우지 못했어요");}});
}

async function mergeScen(from,to){
  S.scEdit=false;S.scDraft=null;
  const mine=S.sessions.filter(x=>info(x).scen===from.name);
  to.aliases=[...new Set([...(to.aliases||[]),from.name,...(from.aliases||[])])].filter(a=>a!==to.name);
  ["summary","rules","system"].forEach(f=>{if(!to[f]&&from[f])to[f]=from[f];});
  const t=toast;location.hash="c-"+to.id;
  try{
    await saveScen(to);
    for(const s of mine){
      const sp=JSON.parse(JSON.stringify([...(from.sp||[]),...((s.sp||[]).filter(o=>!(from.sp||[]).some(x=>x.k===o.k)))]));
      await retry(()=>S.db.doc("sessions/"+s.id).update({scen:to.name,sp,scid:to.id}));await sleep(120);
    }
    await retry(()=>S.db.doc("scenarios/"+from.id).delete());
    S.scens=S.scens.filter(x=>x.id!==from.id);render();t("합쳤어요");
  }catch(e){writeFail(e);t("합치다가 멈췄어요. 다시 시도해 주세요");}
}
function previewLocal(r,inf){
  const {meta,chunks}=buildSession(r,inf);
  closeSession();S.local=true;S.sid="local";S.meta=meta;chunks.forEach((c,i)=>S.chunks[i]=c);rebuild();render();
}
function attachToScen(meta,chunks){
  let sc=findScen(meta.scen);if(sc)meta.scen=sc.name;else sc=createScen(meta.scen,[]);
  const remap={};
  meta.sp.forEach(e=>{const same=sc.sp.find(x=>x.name===e.name);if(same)remap[e.k]=same.k;else sc.sp.push(e);});
  chunks.forEach(c=>c.forEach(b=>{if(remap[b.s])b.s=remap[b.s];}));
  meta.sp=[];return sc;
}
async function importSession(r,inf,pre=""){
  const {meta,chunks}=buildSession(r,inf);
  const sc=attachToScen(meta,chunks);meta.scid=sc.id;
  const sid="s"+Date.now().toString(36)+rid().slice(0,3);
  const prog=$("#iprog"),btn=$("#igo");btn.disabled=true;
  try{
    prog.textContent=pre+"세션 만드는 중…";
    await mutateScen(sc.id,L=>{if(!L.name)Object.assign(L,clone(sc));sc.sp.forEach(e=>{if(!L.sp.some(x=>x.k===e.k))L.sp.push(clone(e));});});
    await retry(()=>S.db.doc("sessions/"+sid).set(meta));
    for(let i=0;i<chunks.length;i++){
      prog.textContent=`${pre}대사 올리는 중… ${i+1}/${chunks.length}`;
      await retry(()=>S.db.doc(`sessions/${sid}/chunks/${ckey(i)}`).set({i,b:chunks[i]}));
      await sleep(150);
    }
    prog.textContent="완료!";return sid;
  }catch(e){
    btn.disabled=false;
    prog.innerHTML=`<span style="color:var(--bad)">${e&&e.code==="invalid_argument"?"이 링크에서는 올릴 권한이 없어요. 페이지 주인에게 편집 권한(Contributor 이상)을 받아 주세요.":"올리다가 멈췄어요. 다시 눌러 주세요."}</span>`;
    return null;
  }
}
async function deleteSession(sid){
  try{
    const snap=await S.db.collection(`sessions/${sid}/chunks`).get();
    for(const d of snap.docs){await retry(()=>S.db.doc(`sessions/${sid}/chunks/${d.id}`).delete());await sleep(100);}
    const ss=S.sessions.find(x=>x.id===sid);if(ss&&ss.audioPath&&S.storage){try{await S.storage.ref(ss.audioPath).delete();}catch(e){}}
    await retry(()=>S.db.doc("sessions/"+sid).delete());toast("지웠어요");
  }catch(e){toast("지우지 못했어요");}
}
