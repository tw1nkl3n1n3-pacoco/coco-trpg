name: cleanup-deployments
on:
  push:
    paths: [".github/workflows/cleanup-deployments.yml"]
permissions:
  deployments: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          CUTOFF: "2026-11-22T08:31:00Z"
        run: |
          ids=$(gh api "repos/$R/deployments?per_page=100" --paginate --jq ".[] | select(.created_at < \"$CUTOFF\") | .id")
          ok=0; fail=0
          for id in $ids; do
            gh api -X POST "repos/$R/deployments/$id/statuses" -f state=inactive >/dev/null 2>&1 || true
            if gh api -X DELETE "repos/$R/deployments/$id" >/dev/null; then ok=$((ok+1)); else fail=$((fail+1)); fi
          done
          echo "deleted=$ok failed=$fail"
