name: 보안 점검 (수동)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 설정 파일 만들기
        env:
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then printf 'window.FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG" > firebase-config.js; fi
      - run: node scripts/sec-check.mjs
