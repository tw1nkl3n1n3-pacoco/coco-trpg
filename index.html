<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코코네 로그방</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe3cc; --panel:#fbf6ec; --panel2:#f3e8d4; --line:#d9c4a3; --ink:#3b2a1a; --dim:#6b5440; --faint:#9a8469;
  --acc:#9c3d22; --acc2:#8a5a1f; --bad:#b3341f; --ok:#4f7a3a; --sel:#ecdcbc; --play:#f6e2b0;
  --gold:#b8862f;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 20% 0%,#f7eedc 0%,transparent 60%),radial-gradient(ellipse at 90% 100%,#e6d5b5 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
button:hover{border-color:var(--faint)}
button.pri{background:var(--acc);color:#fff8ec;border-color:#7d2f19;font-weight:700;box-shadow:0 1px 0 #6a2614}
button.pri:hover{background:#ad4628;border-color:#6a2614}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.hidden{display:none!important}
h1,h2{font-family:"Gowun Batang",serif;font-weight:700;margin:0}
a{color:var(--acc2)}

/* top bar */
header{position:sticky;top:0;z-index:20;background:rgba(246,237,220,.95);box-shadow:0 2px 10px rgba(80,50,20,.08);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.bar h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.bar .sp{flex:1}
.status{font-size:12px;color:var(--faint);white-space:nowrap}
.status.bad{color:var(--bad)} .status.ok{color:var(--ok)}
#pbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(246,237,220,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(80,50,20,.1);padding-bottom:env(safe-area-inset-bottom)}
.player{display:flex;align-items:center;gap:8px;padding:9px 18px;flex-wrap:wrap;max-width:1300px;margin:0 auto}
.player input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.player .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);min-width:120px;text-align:center}
.filebtn{position:relative;overflow:hidden}
a.dl{display:inline-block;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
a.dl:hover{border-color:var(--acc);color:var(--acc)}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
label.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);cursor:pointer}

/* layout */
.wrap{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1300px;margin:0 auto}
aside{position:sticky;top:var(--hdr,60px);align-self:start;max-height:calc(100vh - var(--hdr,60px) - var(--pbar,60px));overflow:auto;padding:16px;border-right:1px solid var(--line)}
aside h3{font-size:12px;letter-spacing:.08em;color:var(--faint);margin:14px 0 8px;font-weight:500}
aside h3:first-child{margin-top:0}
.spk{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:8px}
.spk:hover{background:var(--panel)}
.spk.on{background:var(--sel)}
.spk .key{font-size:11px;color:var(--faint);width:14px;text-align:right;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.spk .nm{flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spk .cnt{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.spk .more{padding:0 6px;line-height:1.4}
.spk input{width:100%;padding:2px 6px}
.addsp{display:flex;gap:6px;margin-top:8px}
.zt{font-size:12px;padding:2px 6px;margin-top:4px}
.addsp input{flex:1;min-width:0}
.tip{font-size:12px;color:var(--faint);line-height:1.55}
.tip kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:11px ui-monospace,monospace;color:var(--dim)}

main{padding:10px 18px calc(var(--pbar,60px) + 40px);min-width:0}
.tools{display:flex;gap:8px;align-items:center;margin:4px 0 10px;flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:160px}

/* rows */
#log{max-width:900px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 12px rgba(80,50,20,.08);padding:8px 14px 18px 8px}
#log>.notice{margin:8px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:2px 10px 2px 6px;border-radius:8px;border:1px solid transparent;scroll-margin:40vh;position:relative}
.row.first{margin-top:10px;padding-top:6px}
.row:hover{background:#faf5ec}
.row.sel{background:var(--sel);border-color:#cdb28a}
.row.playing{background:var(--play)}
.row.playing .body{box-shadow:inset 3px 0 0 var(--acc)}
.row.sel.playing{background:#f0d9a6}
.row.gm{background:#fbf3e3}
.row.gm:hover{background:#f6ead2}
.row.gm.sel{background:var(--sel)}
.ts{background:none;border:none;padding:3px 0 0;white-space:nowrap;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;text-align:right;opacity:0;transition:opacity .1s}
.row.first .ts,.row:hover .ts,.row.sel .ts,.row.playing .ts{opacity:1}
.ts:hover{color:var(--acc)}
.body{min-width:0;padding-left:11px;box-shadow:inset 3px 0 0 color-mix(in srgb,var(--c) 30%,transparent)}
.who{display:inline-flex;align-items:baseline;gap:7px;background:none;border:1px solid transparent;border-radius:6px;padding:0 5px;margin:0 0 1px -6px;color:var(--c);font-weight:700;font-size:14.5px;text-align:left;max-width:100%}
.who:hover{border-color:var(--line);background:var(--panel)}
.who small{display:inline!important;font-weight:400;font-size:12px;color:var(--faint)}
.who small .gmtag{margin-right:3px}
.tx{font-size:15.5px;line-height:1.8;color:#2f2216;word-break:keep-all;overflow-wrap:anywhere;max-width:44em}
.tx .ln{white-space:pre-wrap}
.tx .cut{display:none;border:1px dashed #c9ad82;background:var(--panel);color:var(--acc);font-size:11px;line-height:1.3;padding:0 4px;margin:0 3px;border-radius:4px;vertical-align:1px}
.row.sel .tx .cut{display:inline-block}
.tx .cut:hover{background:var(--acc);color:#fff8ec;border-color:var(--acc)}
.ro .tx .cut{display:none!important}
mark{background:#f2c970;color:inherit;border-radius:3px}
.act{display:flex;gap:2px;opacity:0}
.row:hover .act,.row.sel .act{opacity:1}
.act button{padding:0 6px;font-size:13px;background:none;border-color:transparent;color:var(--dim)}
.act button:hover{color:var(--ink);border-color:var(--line)}
.ro .act .w{display:none}
.tx textarea{width:100%;min-height:60px;resize:vertical;line-height:1.6}
.edhint{font-size:11.5px;color:var(--faint);margin-top:3px}
.nb{background:#efe4cf;border-radius:4px;padding:0 3px;box-shadow:inset 0 -1px 0 #d8c39c}
.nouns{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.noun{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px;background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-size:13px;text-align:left;cursor:pointer;max-width:100%}
.noun b{font-weight:600}.noun small{color:#9a8a78;font-size:11.5px}
.pct{font-size:10px;font-weight:700;color:var(--acc);border:1px solid currentColor;border-radius:4px;padding:0 3px;line-height:14px}
.nedit{display:flex;flex-direction:column;gap:5px;padding:6px;min-width:250px}.nedit label{font-size:12px;color:#8a7a68}
.nedit .btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.ngrp{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:1px 2px}
.ngrp button{width:auto!important;padding:3px 8px!important}.ngrp button.alt{color:#8a7a68;font-size:12.5px}
.nreg{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px;font-size:12.5px}.nreg select{font-size:12.5px;padding:2px 4px}.nreg button{width:auto!important;padding:2px 10px!important}
.row.hand{margin:12px 0}
.row.hand .body{box-shadow:none;background:#fbf5e6;border:1px solid #e2d3b0;border-radius:6px;padding:12px 18px 14px;position:relative;box-shadow:inset 0 0 24px rgba(180,140,70,.08)}
.row.hand .hlab{font-size:11px;color:#a08660;letter-spacing:1px;margin-bottom:4px}
.row.hand .tx{font-family:"Gowun Batang",serif;font-size:15.5px;line-height:1.85;color:#3a2e22;max-width:none}
.row.hand .tx textarea{font-family:"Gowun Batang",serif;min-height:120px}
.row.hand .ph{color:#c4b49c}
.row.dice{margin:6px 0}
.row.dice .body{box-shadow:none}
.row.dice .tx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#f7f3ec;border:1px solid #e8dcc8;border-left:3px solid var(--c);border-radius:8px;padding:6px 12px;max-width:none;font-size:14px}
.row.dice.editing .tx{display:block}
.dw{color:var(--c)}.row.dice small{color:#8a7a68;font-size:12px;margin-left:-6px}
.dl{color:#5a4a3a}.dr{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--ink)}
.dres{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.3px;border-radius:5px;padding:1px 8px;color:#fff;background:#888;border:0}
.dres.secret{background:#3a2e4a}.dres.success{background:#3f7a3a}.dres.failure{background:#8a8178}.dres.critical{background:#c08a14}.dres.fumble{background:#a83a2a}
.dform{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dform select,.dform input{font:inherit;font-size:13.5px;padding:4px 6px}
.dform input[data-f=x]{width:130px}.dform input[data-f=r]{width:170px}
.dos{display:inline-flex;gap:4px}.dos .dres{opacity:.35;cursor:pointer;padding:3px 9px}.dos .dres.on{opacity:1;outline:2px solid #3a2e22;outline-offset:1px}
.row.note{margin:12px 0 4px;padding:6px 10px 6px 6px}
.row.note .body{box-shadow:none;padding-left:0;text-align:center}
.row.note .tx{max-width:none;margin:0 auto;color:#8a7a68;font-size:14px;line-height:1.7;display:flex;align-items:center;gap:14px;justify-content:center}
.row.note .tx::before,.row.note .tx::after{content:"";flex:1;max-width:120px;border-top:1px solid #e3d6c1}
.row.note.editing .tx{display:block;max-width:560px}
.row.note.editing .tx::before,.row.note.editing .tx::after{display:none}
.row.note .tx textarea{text-align:center;color:var(--ink)}
.row.note .ph{color:#c4b49c}
.row.note:hover{background:#faf7f1}
.row.note .ts{opacity:0}
.row.note:hover .ts,.row.note.sel .ts{opacity:1}
.row.note+.row{margin-top:10px}

/* popover */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 10px 30px rgba(80,50,20,.25);min-width:170px;max-height:60vh;overflow:auto}
.pop button{display:flex;gap:8px;align-items:center;width:100%;background:none;border:none;text-align:left;padding:5px 8px;border-radius:6px}
.pop button:hover{background:var(--sel)}
.pop .k{font-size:11px;color:var(--faint);width:12px}
.pop hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.pop input{width:100%;margin:2px 0}

/* home */
.home{max-width:760px;margin:0 auto;padding:30px 18px 80px}
.home h2{font-size:28px;margin-bottom:6px;color:var(--acc)}
h1,h2,.scen-h h3{color:#4a2c17}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.sess{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin:8px 0;cursor:pointer}
.sess:hover{border-color:var(--acc)}
.sess .t{font-weight:700;flex:1}
.sess .d{font-size:12.5px;color:var(--faint)}
.notice{font-size:13px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:10px 0}
.notice.bad{border-color:#e0a597;color:#9a2c18;background:#fbe9e2}

/* scenario groups */
.scen{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 0 #fff inset,0 2px 8px rgba(80,50,20,.07);border-radius:14px;padding:14px 16px 8px;margin:14px 0}
.scen-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.scen-h h3{font-family:"Gowun Batang",serif;font-size:19px;margin:0;flex:1}
.scen-h .d{font-size:12.5px;color:var(--faint)}
.day{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.day-h{display:flex;gap:10px;align-items:baseline;min-width:190px}
.dexp{font-size:12px;font-weight:600;padding:2px 10px;border-radius:7px;border:1px solid var(--acc2)!important;color:var(--acc2)!important;background:#fffaf0!important;white-space:nowrap;align-self:center}.dexp:hover{background:var(--acc2)!important;color:#fff8ec!important}
.day-h .nth{font-size:12px;color:#fff8ec;background:var(--acc2);border-radius:6px;padding:1px 7px}
.parts{display:flex;gap:6px;flex-wrap:wrap}
.part{display:flex;gap:6px;align-items:baseline;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 11px}
.part:hover{border-color:var(--acc)}
.part span{font-size:12px;color:var(--faint)}
.partw{display:inline-flex;align-items:center}
.pset{background:none;border:none;color:var(--faint);padding:2px 5px;font-size:13px;opacity:.55}
.partw:hover .pset{opacity:1}
.pset:hover{color:var(--acc)}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.pnav{display:flex;gap:4px}
.pchip{font-size:13px;text-decoration:none;color:var(--dim);border:1px solid var(--line);border-radius:7px;padding:1px 9px}
.pchip:hover{color:var(--ink);border-color:var(--faint)}
.pchip.on{background:var(--acc);border-color:var(--acc);color:#fff8ec;font-weight:700}
.fields{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--dim)}
.fields .two{display:grid;grid-template-columns:1fr 130px;gap:8px}
.fields input{color-scheme:light}
.addscen{display:flex;gap:8px;margin:14px 0 4px}
.hometop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lockpage{display:flex;justify-content:center;padding-top:12vh}
.lockbox.inline{margin:6px auto;box-shadow:none;background:var(--panel2)}
.lockrow{display:block;padding:10px 0 4px;border-top:1px solid var(--line);color:var(--dim);text-decoration:none;font-size:14px}
.lockrow:hover{color:var(--acc)}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 18px rgba(80,50,20,.1)}
.lockicon{font-size:34px}
.lockbox h2{font-size:22px;margin-top:6px}
.authbox .small{font-size:12px;padding:3px 8px;color:var(--faint)}
.lockbox form{display:flex;gap:8px}
.lockbox input{flex:1;min-width:0;text-align:center;letter-spacing:.08em}
.pwrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pw{font:700 18px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:5px 12px;color:var(--acc)}
.hometop h2{flex:1}
.authbox{display:inline-flex;align-items:center;gap:6px}
.cloud{font-size:12.5px;color:var(--ok);white-space:nowrap}
.audiobox{margin-top:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;line-height:2}
.authbox .me{font-size:12.5px;color:var(--dim)}
.edchip{display:inline-flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 11px;margin:3px 4px 3px 0;font-size:13px}
.edchip button{padding:0 6px;font-size:12px}
.systabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.systab{border-radius:999px;padding:4px 13px;background:var(--panel);font-size:13.5px}
.systab span{color:var(--faint);font-size:12px;margin-left:2px}
.systab.on{background:var(--acc);border-color:#7d2f19;color:#fff8ec;font-weight:700}
.systab.on span{color:#f3d9c8}
.addscen input{flex:1;min-width:0}

a.scl{color:inherit;text-decoration:none;border-bottom:1px dashed var(--faint)}
a.scl:hover{color:var(--acc2)}
.who small,.spk .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--dim);line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.spk .nm small{display:inline}
.who{color:var(--c)}
.cast{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.castc{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 11px 2px 9px;font-size:13px}
.castc b{color:var(--c);font-weight:700}
.castc.gm{border-color:#c9a25e;background:#f7ead0}
.castc.gm b,.row.gm .who{color:#5a3a1e}
.gmtag{display:inline-block;font:700 10px/1.5 "Noto Sans KR",sans-serif;letter-spacing:.04em;color:#fff8ec;background:var(--gold);border-radius:4px;padding:0 5px;vertical-align:1px;margin-right:4px}
.roster.ed{grid-template-columns:16px 1fr 1fr 34px 44px 96px}
.roster.ed input[type=radio]{accent-color:var(--acc);justify-self:center;width:16px;height:16px}
.castc span:not(.dot):not(.gmtag){color:var(--faint);font-size:12px}
.castc .gmtag{margin-right:0}
.scen-h h3 a{color:inherit;text-decoration:none}
.scen-h h3 a:hover{color:var(--acc2)}
.sys{font-size:12px;color:var(--acc);background:#f7e6d6;border:1px solid #d9a88f;border-radius:6px;padding:0 7px}
.scen .sum{font-size:13.5px;color:var(--dim);margin:2px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.sc-page{max-width:820px;margin:0 auto;padding:20px 18px 80px}
.sc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sc-top h2{font-size:28px;flex:1;min-width:0}
.sc-sec h4{color:var(--acc2)!important;border-bottom:1px solid var(--line);padding-bottom:6px}
.sc-sec h4+.day{border-top:none}
.sc-sec{background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(80,50,20,.06);border-radius:14px;padding:14px 18px;margin:12px 0}
.sc-sec h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;color:var(--faint);font-weight:500}
.sc-text{white-space:pre-wrap;word-break:break-word;line-height:1.75}
.sc-text.empty{color:var(--faint);font-size:13.5px}
.sc-sec textarea{width:100%;min-height:140px;resize:vertical;line-height:1.7}
.sc-sec input[type=text]{width:100%}
.roster{display:grid;grid-template-columns:16px 1fr 1fr auto;gap:6px 10px;align-items:center}
.roster .h{font-size:12px;color:var(--faint)}
.roster .cnum{font-size:12px;color:var(--faint);text-align:right}

<body>
<div id="app"></div>
<div id="layer"></div>

<script>
// ---------- parser ----------
function unent(t){return t.replace(/&(amp|lt|gt|quot|#39|apos|nbsp);|&#(\d+);/g,(m,n,d)=>d?String.fromCharCode(+d):({amp:"&",lt:"<",gt:">",quot:'"',"#39":"'",apos:"'",nbsp:" "}[n]));}
function parseClova(text){
  text=unent(text);
  const lines=text.replace(/\r\n?/g,"\n").split("\n");
  const title=(lines[0]||"").trim()||"제목 없는 세션";
  const dateLine=(lines[1]||"").trim();
  const head=/^(.+?) (\d{1,2}:\d{2}(?::\d{2})?)$/;
  const blocks=[];let cur=null,prevBlank=true;
  for(let i=2;i<lines.length;i++){
    const ln=lines[i].trim();
    if(!ln){if(cur){blocks.push(cur);cur=null;}prevBlank=true;continue;}
    const m=prevBlank&&!cur?ln.match(head):null;
    if(m){const p=m[2].split(":").map(Number);const t=p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];cur={s:m[1].trim(),t,x:[]};}
    else if(cur){cur.x.push(ln);}
    prevBlank=false;
  }
  if(cur)blocks.push(cur);
  return {title,dateLine,blocks:blocks.filter(b=>b.x.length).map(b=>({s:b.s,t:b.t,x:b.x.join("\n").replace(/clovanote\.naver\.com\s*$/,"").trim()})).filter(b=>b.x)};
}

// ---------- utils ----------
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=()=>Math.random().toString(36).slice(2,9);
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(s).padStart(2,"0");};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COLORS=["#a8401f","#2f6690","#4f7a2a","#7a4a9e","#b8691c","#1f7f74","#a83a62","#7d6a14","#3f4fa0","#5c4a3a","#c0392b","#2e6b4f"];
const CHUNK=60;
const OLDC=["#f3c97f","#8fc7f2","#f29a9a","#a5dd9b","#d4a5f5","#f5b98a","#7fd8d0","#f2a7d0","#c9c97f","#9fa8f5","#e8e8e8","#b8e07a"];
const fixC=c=>{const i=OLDC.indexOf(c);return i>=0?COLORS[i]:(c||"#7a6a5a");};
const ckey=i=>"c"+String(i).padStart(3,"0");
function toast(msg,ms=2200){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
async function retry(fn){
  for(let a=0;;a++){
    try{return await fn();}
    catch(e){const c=e&&e.code;if((c==="resource_exhausted"||c==="resource-exhausted"||c==="unavailable"||c==="deadline-exceeded"||!c)&&a<5){await sleep(1200*(a+1)+Math.random()*400);continue;}throw e;}
  }
}

// ---------- state ----------
let _sys=null;try{_sys=localStorage.getItem("trpg-sys")||null;}catch(e){}
const S={ops:{},sysFilter:_sys,fresh:new Set(),showZero:false,db:null,user:null,canWrite:false,canAdmin:false,ready:false,auth:null,authUser:null,editors:[],owner:"",setupNeeded:false,
  sessions:[],sid:null,meta:null,chunks:{},flat:[],byId:new Map(),
  sel:null,q:"",spFilter:null,follow:true,undo:[],
  dirty:new Set(),inflight:new Set(),tmr:{},err:null,
  unsub:[],local:false,scens:[],scensLoaded:false,cid:null,scBusy:{},scAgain:{},chunksLoaded:false,ensured:false,ensuring:false,scEdit:false,audioUrl:null,playingId:null,metaBusy:false,metaAgain:false,loadTimer:null,loaded:false};

const SCC={};
// ---------- boot ---------- (스크립트를 다 읽은 뒤 시작)
setTimeout(async()=>{
  render();
  const cfg=window.FIREBASE_CONFIG;
  S.owner=String(window.OWNER_EMAIL||"").trim().toLowerCase();
  if(window.firebase&&cfg&&cfg.apiKey&&!/YOUR_|여기에/.test(cfg.apiKey)){
    try{
      firebase.initializeApp(cfg);
      S.db=firebase.firestore();
      try{S.db.settings({ignoreUndefinedProperties:true,merge:true});}catch(e){}
      S.auth=firebase.auth();
      try{S.storage=firebase.storage();}catch(e){S.storage=null;}
    }catch(e){S.db=null;S.err="Firebase 설정을 읽지 못했어요: "+(e.message||e);}
  }else S.setupNeeded=true;
  S.ready=true;
  if(!S.db)render();
  if(S.db){
    S.loadTimer=setTimeout(()=>{if(!S.loaded){S.err="저장소에 아직 연결되지 않았어요. 잠시 후 다시 확인해 주세요.";render();}},10000);
    S.auth.onAuthStateChanged(u=>{
      S.authUser=u;
      if(!u){S.auth.signInAnonymously().catch(()=>{S.loaded=true;render();});return;}
      updatePerms();syncSubs(true);
    });
  }
  route();
},0);
// ---------- data subscriptions (권한에 따라 읽을 수 있는 것만) ----------
let _unlockIds=[];try{_unlockIds=JSON.parse(localStorage.getItem("trpg-unlocked")||"[]");}catch(e){}
function saveUnlocks(){try{localStorage.setItem("trpg-unlocked",JSON.stringify(_unlockIds));}catch(e){}}
const SUB={mode:null,all:[],scen:{},sess:{},edQ:null,scData:{},sessData:{},edIds:[]};
function myEmail(){return String(S.authUser&&!S.authUser.isAnonymous&&S.authUser.email||"").toLowerCase();}
function isEditorOf(id){const sc=scenById(id);return !!sc&&!!myEmail()&&(sc.editors||[]).map(x=>String(x).toLowerCase()).includes(myEmail());}
// 비밀번호로 연 시나리오는 보기·고치기 모두 가능
// 시나리오 목록·개요는 누구나 보고, 로그는 비밀번호로 연 사람만 (녹음 목록을 받아온 시나리오 = 열린 시나리오)
function isOpen(id){return S.canAdmin||(!!id&&!!SUB.sessData[id]);}
function canWriteScen(id){return !!id&&isOpen(id);}
function canReadScen(id){return isOpen(id);}
function publish(){
  const old=S.scens;
  const ids=new Set([...Object.keys(SUB.scData)]);
  S.scens=[...ids].map(id=>{const o=old.find(x=>x.id===id);return (S.scBusy[id]&&o)?o:{id,...JSON.parse(JSON.stringify(SUB.scData[id]))};});
  old.forEach(o=>{if(S.scBusy[o.id]&&!S.scens.find(x=>x.id===o.id))S.scens.push(o);});
  const all=[];Object.values(SUB.sessData).forEach(m=>Object.values(m).forEach(x=>all.push(x)));
  S.sessions=all.sort((a,b)=>String(a.title).localeCompare(String(b.title),"ko",{numeric:true}));
  const cwChanged=refreshCanWrite();
  if(S.sid){if(cwChanged)render();else{renderSide();renderAllRows(true);renderHeader();}maybeEnsure();}
  else if(!S.importing&&!S.scEdit)render();
  if(S.canAdmin)ownerMaintain();
}
function markLoaded(){if(!S.loaded){S.loaded=true;S.scensLoaded=true;clearTimeout(S.loadTimer);if(S.err&&S.err.startsWith("저장소"))S.err=null;}}
function clearSubs(){
  SUB.all.forEach(u=>{try{u()}catch(e){}});SUB.all=[];
  Object.values(SUB.scen).forEach(u=>{try{u()}catch(e){}});Object.values(SUB.sess).forEach(u=>{try{u()}catch(e){}});

  SUB.scen={};SUB.sess={};SUB.edQ=null;SUB.scData={};SUB.sessData={};SUB.edIds=[];
}
function syncSubs(reset){
  if(!S.db||!S.authUser)return;
  const mode=S.canAdmin?"owner":"user:"+(myEmail()||"anon");
  if(reset||mode!==SUB.mode){clearSubs();SUB.mode=mode;}
  if(S.canAdmin){
    if(SUB.all.length)return;
    SUB.all.push(S.db.collection("scenarios").onSnapshot(snap=>{SUB.scData={};snap.docs.forEach(d=>SUB.scData[d.id]=d.data());markLoaded();publish();},e=>{markLoaded();render();}));
    SUB.all.push(S.db.collection("sessions").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});SUB.sessData={all:m};markLoaded();publish();},e=>{}));
    SUB.all.push(S.db.collection("secrets").onSnapshot(snap=>{S.secrets={};snap.docs.forEach(d=>S.secrets[d.id]=d.data().pw);if(S.cid&&!S.scEdit)render();ownerMaintain();},()=>{}));
    return;
  }
  // 시나리오 목록은 누구나
  if(!SUB.all.length)SUB.all.push(S.db.collection("scenarios").onSnapshot(snap=>{SUB.scData={};snap.docs.forEach(d=>SUB.scData[d.id]=d.data());markLoaded();publish();},e=>{markLoaded();render();}));
  // 로그(녹음)는 비밀번호로 연 시나리오만
  _unlockIds.forEach(id=>watchSess(id));
}
function watchSess(id){
  if(SUB.sess[id])return;
  SUB.sess[id]=S.db.collection("sessions").where("scid","==",id).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>m[d.id]={id:d.id,...d.data()});SUB.sessData[id]=m;publish();
  },e=>{ // 비밀번호가 바뀌었거나 권한이 없어짐
    delete SUB.sess[id];delete SUB.sessData[id];
    _unlockIds=_unlockIds.filter(x=>x!==id);saveUnlocks();publish();
  });
}
function watchScenSessions(){}
async function unlockScen(id,pw){
  if(!S.authUser){await S.auth.signInAnonymously();}
  const uid=S.auth.currentUser.uid;
  await S.db.doc(`unlocks/${id}_${uid}`).set({scid:id,uid,pw:String(pw).trim(),at:Date.now()});
  if(!_unlockIds.includes(id)){_unlockIds.push(id);saveUnlocks();}
  watchSess(id);
}
// 사이트 주인: 녹음에 시나리오 id 달기, 시나리오마다 열람 비밀번호 만들기
let _maintTimer=null;const _pwMade=new Set();
function ownerMaintain(){clearTimeout(_maintTimer);_maintTimer=setTimeout(_ownerMaintain,1500);}
async function _ownerMaintain(){
  if(!S.canAdmin||!S.db||!S.secrets)return;
  for(const s of S.sessions){
    const sc=findScen(info(s).scen);
    if(sc&&s.scid!==sc.id){try{await S.db.doc("sessions/"+s.id).update({scid:sc.id});}catch(e){}}
  }
  // 시나리오마다 회차 수·마지막 플레이 날짜를 적어둬요 (로그인 안 한 사람의 목록 정렬용)
  for(const sc of S.scens){
    const days=[...new Set(S.sessions.filter(x=>info(x).scen===sc.name).map(x=>info(x).day).filter(Boolean))].sort();
    const lastDay=days.length?days[days.length-1]:"";
    if((sc.lastDay||"")!==lastDay||(sc.nDays||0)!==days.length){try{await S.db.doc("scenarios/"+sc.id).update({lastDay,nDays:days.length});}catch(e){}}
  }
  for(const sc of S.scens){
    if(!S.secrets[sc.id]&&!_pwMade.has(sc.id)){_pwMade.add(sc.id);try{const ex=await S.db.doc("secrets/"+sc.id).get();if(!ex.exists)await S.db.doc("secrets/"+sc.id).set({pw:genPw()});}catch(e){_pwMade.delete(sc.id);}}
  }
}
function genPw(){const c="abcdefghjkmnpqrstuvwxyz23456789";let o="";const a=new Uint32Array(8);crypto.getRandomValues(a);a.forEach(n=>o+=c[n%c.length]);return o;}
function refreshCanWrite(){
  const id=S.cid||(S.meta&&curScen()?.id)||null;
  const v=S.sid||S.cid?canWriteScen(id):S.canAdmin;
  if(v!==S.canWrite){S.canWrite=v;return true;}return false;
}
// ---------- login & permissions ----------
function updatePerms(){
  const em=myEmail();
  const before=S.canAdmin;
  S.canAdmin=!!em&&em===S.owner;
  refreshCanWrite();
  if(before!==S.canAdmin){if(S.sid||(!S.importing&&!S.scEdit))render();}
  else renderAuth();
}
async function login(){
  try{await S.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
  catch(e){if(e&&e.code==="auth/popup-blocked"){try{await S.auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());}catch(_){}}else if(e&&e.code!=="auth/popup-closed-by-user")toast("로그인하지 못했어요: "+(e.code||e.message),4000);}
}
function authHTML(){
  if(!S.auth)return "";
  const u=S.authUser;
  return u&&!u.isAnonymous?`<span class="me">${esc(u.displayName||u.email)}${S.canAdmin?" · 주인":""}</span><button class="ghost" data-logout>로그아웃</button>`
    :`<button class="ghost small" data-login title="사이트 주인 전용">관리자 로그인</button>`;
}
function renderAuth(){
  document.querySelectorAll(".authbox").forEach(el=>el.innerHTML=authHTML());
  document.querySelectorAll("[data-login]").forEach(b=>b.onclick=login);
  document.querySelectorAll("[data-logout]").forEach(b=>b.onclick=()=>S.auth.signOut());
}
window.addEventListener("hashchange",route);

function route(){
  const h=location.hash.slice(1);
  const sid=h.startsWith("s-")?h.slice(2):null;
  const cid=h.startsWith("c-")?h.slice(2):null;
  if(sid!==S.sid||cid!==S.cid){if(cid)delete SCC[cid];S.cid=cid;S.scEdit=!!cid&&S.pendingEdit===cid;S.pendingEdit=null;S.scDraft=null;openSession(sid);window.scrollTo(0,0);}
}

// ---------- session load ----------
function closeSession(){flushAll();S.ops={};S.dirty.clear();const a=document.getElementById("aud");if(a&&S.audioUrl){a.pause();a.removeAttribute("src");a.load();if(!S.audioCloud)URL.revokeObjectURL(S.audioUrl);S.audioUrl=null;S.playingId=null;}S.audioCloud=false;S.audioLoading=false;S.unsub.forEach(u=>{try{u()}catch(e){}});S.unsub=[];S.meta=null;S.chunks={};S.flat=[];S.chunksLoaded=false;S.ensured=false;S.byId.clear();S.sel=null;S.undo=[];S.spFilter=null;S.q="";}
function openSession(sid){
  if(S.local&&sid===null){/* leaving local view */S.local=false;}
  closeSession();S.sid=sid;
  if(!sid){render();return;}
  if(!S.db){render();return;}
  render();
  const u1=S.db.doc("sessions/"+sid).onSnapshot(d=>{
    if(!d.exists){if(!d.metadata.fromCache){S.meta=null;S.err="이 세션을 찾을 수 없어요.";render();}return;}
    if(S.metaBusy)return;
    S.meta=JSON.parse(JSON.stringify(d.data()));
    if(S.meta.audioPath&&!S.audioUrl&&!S.audioLoading)loadCloudAudio();
    if(refreshCanWrite())render();else{renderSide();renderAllRows();renderHeader();}maybeEnsure();
  },e=>{S.err=e&&e.code==="permission-denied"?"이 녹음은 잠겨 있어요. 시나리오 링크로 들어와서 비밀번호를 입력해 주세요.":"세션 정보를 불러오지 못했어요.";render();});
  const u2=S.db.collection("sessions/"+sid+"/chunks").onSnapshot(snap=>{
    let changed=false;
    snap.docs.forEach(d=>{
      const ci=d.data().i;
      if(S.dirty.has(ci)||S.inflight.has(ci)||(S.ops[ci]||[]).length)return;
      const b=d.data().b||[];
      if(JSON.stringify(S.chunks[ci])!==JSON.stringify(b)){S.chunks[ci]=JSON.parse(JSON.stringify(b));changed=true;}
    });
    if(!snap.metadata.fromCache)S.chunksLoaded=true;
    if(changed){rebuild();renderAllRows(true);renderSide();}
    maybeEnsure();
  },e=>{if(!(S.err||"").includes("잠겨"))S.err="로그를 불러오지 못했어요.";render();});
  S.unsub.push(u1,u2);
}

function rebuild(){
  S.flat=[];S.byId.clear();
  Object.keys(S.chunks).map(Number).sort((a,b)=>a-b).forEach(ci=>{
    S.chunks[ci].forEach((b,bi)=>{const e={b,ci,bi};S.flat.push(e);S.byId.set(b.id,e);});
  });
}

// ---------- persistence ----------
// 고친 내용을 "작업"(op) 단위로 모았다가, 저장할 때 최신 내용을 다시 읽어 그 위에 작업만 덧붙여요.
// 그래서 여럿이 같은 부분을 동시에 고쳐도 서로의 수정이 덮이지 않아요.
const clone=o=>JSON.parse(JSON.stringify(o));
function applyOp(arr,op){
  if(op.t==="set"){const b=arr.find(x=>x.id===op.id);if(b)Object.keys(op.f).forEach(k=>{if(op.f[k]===undefined)delete b[k];else b[k]=op.f[k];});}
  else if(op.t==="ins"){
    if(arr.some(x=>x.id===op.b.id))return;
    let i;
    if(op.after===null)i=0;
    else{const j=arr.findIndex(x=>x.id===op.after);
      if(j>=0)i=j+1;else{i=0;arr.forEach((x,k)=>{if(x.t<=op.b.t)i=k+1;});}}
    arr.splice(i,0,clone(op.b));
  }
  else if(op.t==="del"){const i=arr.findIndex(x=>x.id===op.id);if(i>=0)arr.splice(i,1);}
}
function invOp(arr,op){
  if(op.t==="set"){const b=arr.find(x=>x.id===op.id)||{};const f={};Object.keys(op.f).forEach(k=>f[k]=b[k]);return {t:"set",id:op.id,f};}
  if(op.t==="ins")return {t:"del",id:op.b.id};
  const i=arr.findIndex(x=>x.id===op.id);return {t:"ins",after:i>0?arr[i-1].id:null,b:clone(arr[i])};
}
// list: [{ci,op}] — 화면에 바로 반영하고 저장 대기열에 넣어요
function doOps(list,label){
  const inv=[];
  list.forEach(({ci,op})=>{const arr=S.chunks[ci];if(!arr)return;inv.unshift({ci,op:invOp(arr,op)});applyOp(arr,op);(S.ops[ci]=S.ops[ci]||[]).push(op);});
  if(label){S.undo.push({label,inv});if(S.undo.length>100)S.undo.shift();}
  rebuild();[...new Set(list.map(x=>x.ci))].forEach(ci=>touch(ci));
}
function touch(ci){
  if(S.local){renderStatus();return;}
  S.dirty.add(ci);clearTimeout(S.tmr[ci]);S.tmr[ci]=setTimeout(()=>flush(ci),700);renderStatus();
}
async function flush(ci){
  if(S.inflight.has(ci))return;
  const ops=S.ops[ci]||[];
  if(!ops.length){S.dirty.delete(ci);renderStatus();return;}
  const sid=S.sid,ref=S.db.doc(`sessions/${sid}/chunks/${ckey(ci)}`);
  S.ops[ci]=[];S.inflight.add(ci);S.dirty.delete(ci);renderStatus();
  try{
    const merged=await S.db.runTransaction(async tx=>{
      const d=await tx.get(ref);const arr=d.exists?clone(d.data().b||[]):[];
      ops.forEach(op=>applyOp(arr,op));tx.set(ref,{i:ci,b:arr});return arr;
    });
    S.err=null;
    if(S.sid===sid){ // 다른 사람 수정까지 합쳐진 최신 내용 + 아직 안 보낸 내 작업
      const arr=clone(merged);(S.ops[ci]||[]).forEach(op=>applyOp(arr,op));
      if(JSON.stringify(arr)!==JSON.stringify(S.chunks[ci])){S.chunks[ci]=arr;rebuild();renderAllRows(true);renderSideCounts();}
    }
  }catch(e){if(S.sid===sid)S.ops[ci]=ops.concat(S.ops[ci]||[]);writeFail(e);}
  S.inflight.delete(ci);
  if(S.sid===sid&&(S.ops[ci]||[]).length&&!S.err){S.dirty.add(ci);flush(ci);}
  renderStatus();
}
function flushAll(){Object.keys(S.ops).forEach(ci=>{if((S.ops[ci]||[]).length){clearTimeout(S.tmr[ci]);flush(+ci);}});}
window.addEventListener("beforeunload",ev=>{if(Object.values(S.ops).some(o=>o&&o.length)||S.inflight.size){flushAll();ev.preventDefault();ev.returnValue="";}});
function writeFail(e){
  if(e&&(e.code==="invalid_argument"||e.code==="permission-denied")){S.canWrite=false;S.err="고칠 권한이 없어서 보기 전용으로 바뀌었어요. 비밀번호가 바뀌었다면 시나리오 링크로 다시 들어와 새 비밀번호를 넣어 주세요.";render();}
  else if(e&&e.code==="quota_exceeded"){S.err="저장 공간이 가득 찼어요: "+(e.message||"");}
  else S.err="저장에 실패했어요. 잠시 후 다시 시도해 주세요.";
  renderStatus();
}
async function saveMeta(){
  if(S.local){renderSide();renderAllRows();return;}
  if(S.metaBusy){S.metaAgain=true;return;}
  S.metaBusy=true;renderStatus();
  try{await retry(()=>S.db.doc("sessions/"+S.sid).set(S.meta));}catch(e){writeFail(e);}
  S.metaBusy=false;
  if(S.metaAgain){S.metaAgain=false;saveMeta();}
  renderStatus();
}
// 되돌리기: 내가 한 작업만 거꾸로 적용해요 (다른 사람 수정은 건드리지 않아요)
function undo(){
  const u=S.undo.pop();if(!u){toast("되돌릴 작업이 없어요");return;}
  doOps(u.inv.filter(x=>S.chunks[x.ci]),null);
  renderAllRows(true);renderSide();toast("되돌림: "+u.label);
}

// ---------- scenarios ----------
function hashName(n){let h=2166136261;for(const ch of n){h^=ch.codePointAt(0);h=Math.imul(h,16777619)>>>0;}return "c"+h.toString(36);}
const scenByName=n=>S.scens.find(x=>x.name===n);
const scenById=id=>S.scens.find(x=>x.id===id);
function curScen(){return S.meta?findScen(info(S.meta).scen):null;}
function newScenId(name){let id=hashName(name),i=2;while(scenById(id))id=hashName(name)+"-"+(i++);return id;}
async function saveScen(sc){
  if(S.local)return;
  const id=sc.id;
  if(S.scBusy[id]){S.scAgain[id]=true;return;}
  S.scBusy[id]=true;renderStatus();
  const {id:_,...body}=sc;
  try{await retry(()=>S.db.doc("scenarios/"+id).set(JSON.parse(JSON.stringify(body))));}catch(e){writeFail(e);}
  S.scBusy[id]=false;
  if(S.scAgain[id]){S.scAgain[id]=false;await saveScen(scenById(id)||sc);}
  renderStatus();
}
// 시나리오 정보도 저장 순간의 최신 내용을 읽어서 바꾼 부분만 적용해요
async function mutateScen(id,fn){
  const sc=scenById(id);if(sc)fn(sc);
  if(S.local||!S.db)return;
  S.scBusy[id]=(S.scBusy[id]||0)+1;renderStatus();
  try{
    await S.db.runTransaction(async tx=>{
      const ref=S.db.doc("scenarios/"+id);const d=await tx.get(ref);
      const body=d.exists?clone(d.data()):(sc?clone(sc):{});body.sp=body.sp||[];
      fn(body);delete body.id;tx.set(ref,clone(body));
    });
  }catch(e){writeFail(e);}
  S.scBusy[id]--;renderStatus();
}
function createScen(name,sp){
  const sc={id:newScenId(name),name,system:"",summary:"",rules:"",sp:sp||[],created:Date.now()};
  S.scens.push(sc);return sc;
}
// 녹음별로 따로 있던 화자 목록을 시나리오 공용 목록으로 합치기
function maybeEnsure(){
  if(S.ensured||S.ensuring||S.local||!S.db||!S.canWrite||!S.meta||!S.scensLoaded||!S.chunksLoaded)return;
  S.ensuring=true;ensureScen().finally(()=>{S.ensuring=false;});
}
async function ensureScen(){
  const name=info(S.meta).scen;let sc=findScen(name);
  const own=S.meta.sp||[];
  if(!sc){sc=createScen(name,JSON.parse(JSON.stringify(own)));await saveScen(sc);}
  else if(own.length){
    const remap={},toAdd=[];
    own.forEach(e=>{
      if(sc.sp.some(x=>x.k===e.k))return;
      const same=sc.sp.find(x=>x.name===e.name);
      if(same)remap[e.k]=same.k;else toAdd.push({...e});
    });
    if(toAdd.length)await mutateScen(sc.id,d=>{toAdd.forEach(e=>{if(!d.sp.some(x=>x.k===e.k))d.sp.push({...e});});});
    if(Object.keys(remap).length)doOps(S.flat.filter(x=>remap[x.b.s]).map(x=>({ci:x.ci,op:{t:"set",id:x.b.id,f:{s:remap[x.b.s]}}})),null);
  }
  if(own.length||!S.meta.scen){S.meta.sp=[];Object.assign(S.meta,info(S.meta));await saveMeta();}
  S.ensured=true;renderSide();renderAllRows(true);
  cleanupZero();
}
async function countsElsewhere(){
  const sc=curScen();const m={};if(!sc)return m;
  for(const s of S.sessions){
    if(s.id===S.sid||info(s).scen!==sc.name)continue;
    const snap=await S.db.collection(`sessions/${s.id}/chunks`).get();
    snap.docs.forEach(d=>(d.data().b||[]).forEach(b=>{m[b.s]=(m[b.s]||0)+1;}));
  }
  return m;
}
// 시나리오의 어느 녹음에도 대사가 없는 화자를 목록에서 정리
async function cleanupZero(){
  const sc=curScen();if(!sc||!S.canWrite||S.local)return;
  const here=counts();
  const cand=sc.sp.filter(p=>!(here[p.k]>0)&&p.k!==gmKey(sc)&&!S.fresh.has(p.k));
  if(!cand.length)return;
  let other;try{other=await countsElsewhere();}catch(e){return;}
  const dead=new Set(cand.filter(p=>!(other[p.k]>0)&&!(counts()[p.k]>0)).map(p=>p.k));
  if(!dead.size)return;
  if(dead.has(S.spFilter))S.spFilter=null;
  await mutateScen(sc.id,d=>{d.sp=d.sp.filter(p=>!dead.has(p.k));});renderSide();
}
async function usageElsewhere(k){
  const sc=curScen();if(!sc)return 0;
  let n=0;
  for(const s of S.sessions){
    if(s.id===S.sid||info(s).scen!==sc.name)continue;
    try{const snap=await S.db.collection(`sessions/${s.id}/chunks`).get();snap.docs.forEach(d=>(d.data().b||[]).forEach(b=>{if(b.s===k)n++;}));}catch(e){n++;}
  }
  return n;
}

// ---------- speakers ----------
const ALL="__all",ALLSP={k:ALL,name:"전원",c:"#8a8178"};
const gmKey=sc=>sc&&sc.gm&&(sc.sp||[]).some(x=>x.k===sc.gm)?sc.gm:null;
const gmFirst=(arr,g)=>g?[...arr.filter(x=>x.k===g),...arr.filter(x=>x.k!==g)]:arr;
function spList(){
  const sc=curScen();const own=(S.meta?.sp||[]).filter(o=>o.k!==ALL);
  if(!sc)return own.concat(ALLSP);
  return gmFirst(sc.sp.filter(x=>x.k!==ALL).concat(own.filter(o=>!sc.sp.some(x=>x.k===o.k))),gmKey(sc)).concat(ALLSP);
}
const isGM=k=>!!k&&gmKey(curScen())===k;
const gmTag='<span class="gmtag">GM</span>';
const spBy=k=>spList().find(s=>s.k===k)||{k,name:"(목록에 없는 화자)",c:"#888"};
function spTarget(){const sc=curScen();return sc?sc.sp:S.meta.sp;}
function saveSp(){saveMeta();}
function counts(){const c={};S.flat.forEach(e=>{if(e.b.s!==NOTE&&e.b.s!==DICE&&e.b.s!==HAND)c[e.b.s]=(c[e.b.s]||0)+1;});return c;}
function addNote(afterId){
  if(!S.canWrite)return;
  const e=S.byId.get(afterId);if(!e)return;
  const nb={id:rid(),s:NOTE,t:e.b.t,x:""};
  doOps([{ci:e.ci,op:{t:"ins",after:e.b.id,b:nb}}],"상황 묘사 추가");
  renderAllRows(true);select(nb.id,false);editRow(nb.id);
}
function addHand(afterId){
  if(!S.canWrite)return;
  const e=S.byId.get(afterId);if(!e)return;
  const nb={id:rid(),s:HAND,t:e.b.t,x:""};
  doOps([{ci:e.ci,op:{t:"ins",after:e.b.id,b:nb}}],"핸드아웃 추가");
  renderAllRows(true);select(nb.id,false);editRow(nb.id);
}
function addDice(afterId){
  if(!S.canWrite)return;
  const e=S.byId.get(afterId);if(!e)return;
  const w=e.b.s===DICE?e.b.w:(e.b.s===NOTE?"":e.b.s);
  const nb={id:rid(),s:DICE,t:e.b.t,x:"",w:w||"",r:"",o:""};
  doOps([{ci:e.ci,op:{t:"ins",after:e.b.id,b:nb}}],"주사위 추가");
  renderAllRows(true);select(nb.id,false);editRow(nb.id);
}
function addSpeaker(name){
  name=name.trim();if(!name)return null;
  const ex=spList().find(s=>s.name===name);if(ex)return ex.k;
  const k="k"+rid();const c=counts();const arr=spTarget();
  // 새 화자는 '주요 화자'(대사 10개 이상) 바로 뒤에 넣어서 숫자키 1~9 안에 들어오게
  const before=(arr.find(s=>(c[s.k]||0)>0&&(c[s.k]||0)<10)||{}).k||null;
  const np={k,name,c:COLORS[arr.length%COLORS.length]};
  const ins=a=>{if(a.some(x=>x.k===k))return;const i=before?a.findIndex(x=>x.k===before):-1;if(i<0)a.push({...np});else a.splice(i,0,{...np});};
  S.fresh.add(k);
  const sc=curScen();if(sc)mutateScen(sc.id,d=>ins(d.sp));else{ins(arr);saveMeta();}
  renderSide();return k;
}
function assign(id,k){
  const e=S.byId.get(id);if(!e||e.b.s===k)return;
  const old=e.b.s;
  doOps([{ci:e.ci,op:{t:"set",id,f:{s:k}}}],"화자 변경");updateRow(id);
  const c=counts();
  if((c[k]||0)===1||!(c[old]>0)){renderSide();}else renderSideCounts();
  if(!(c[old]>0)&&!isGM(old)&&!S.fresh.has(old)){clearTimeout(S.zeroTmr);S.zeroTmr=setTimeout(cleanupZero,4000);}
}
function shownSp(){
  const c=counts();
  return spList().filter(s=>s.k!==ALL&&(S.showZero||(c[s.k]||0)>0||isGM(s.k)||S.fresh.has(s.k)));
}
async function removeSpeakerIfUnused(k){
  if((counts()[k]||0)>0)return false;
  const n=await usageElsewhere(k);
  if(n>0){toast(`같은 시나리오의 다른 녹음에서 ${n}개 대사가 이 화자로 되어 있어서 목록에는 남겨뒀어요`,3500);return false;}
  const sc=curScen();if(sc)mutateScen(sc.id,d=>{d.sp=d.sp.filter(x=>x.k!==k);});
  if(S.meta.sp?.some(x=>x.k===k)){S.meta.sp=S.meta.sp.filter(x=>x.k!==k);saveMeta();}
  if(S.spFilter===k)S.spFilter=null;renderSide();return true;
}
async function mergeSpeaker(from,to){
  doOps(S.flat.filter(e=>e.b.s===from).map(e=>({ci:e.ci,op:{t:"set",id:e.b.id,f:{s:to}}})),"화자 합치기");
  if(S.spFilter===from)S.spFilter=null;
  renderAllRows();renderSide();toast("옮겼어요");
  await removeSpeakerIfUnused(from);
}

// ---------- edits ----------
function splitBlock(id,lineIdx){
  const e=S.byId.get(id);if(!e)return;
  const lines=e.b.x.split("\n");if(lineIdx<=0||lineIdx>=lines.length)return;
  const nb={id:rid(),s:e.b.s,t:e.b.t,x:lines.slice(lineIdx).join("\n")};
  doOps([{ci:e.ci,op:{t:"set",id,f:{x:lines.slice(0,lineIdx).join("\n")}}},{ci:e.ci,op:{t:"ins",after:id,b:nb}}],"나누기");
  renderAllRows(true);renderSideCounts();select(nb.id);
}
function mergePrev(id){
  const e=S.byId.get(id);if(!e)return;
  const idx=S.flat.indexOf(e);if(idx<=0)return;
  const p=S.flat[idx-1];
  doOps([{ci:p.ci,op:{t:"set",id:p.b.id,f:{x:p.b.x+"\n"+e.b.x}}},{ci:e.ci,op:{t:"del",id}}],"위와 합치기");
  renderAllRows(true);renderSideCounts();select(p.b.id);
}
function delBlock(id){
  const e=S.byId.get(id);if(!e)return;
  const idx=S.flat.indexOf(e);const nxt=S.flat[idx+1]||S.flat[idx-1];
  doOps([{ci:e.ci,op:{t:"del",id}}],"삭제");
  renderAllRows(true);renderSideCounts();if(nxt)select(nxt.b.id);toast("삭제했어요 · Ctrl+Z로 되돌리기");
}
function setText(id,x){
  const e=S.byId.get(id);if(!e)return;x=x.replace(/\n{2,}/g,"\n").trim();
  if(!x){delBlock(id);return;}
  if(x===e.b.x)return;doOps([{ci:e.ci,op:{t:"set",id,f:{x}}}],"텍스트 수정");
}

// ---------- HTML로 내보내기 (회차 단위, 코코포리아 로그 형식) ----------
async function buildDayHTML(scen,day){
  const sc=findScen(scen);
  const ss=S.sessions.filter(s=>{const i=info(s);return i.scen===scen&&i.day===day;}).map(s=>({...s,...info(s)})).sort((a,b)=>a.part-b.part);
  const days=[...new Set(S.sessions.map(info).filter(i=>i.scen===scen).map(i=>i.day))].sort();
  const nth=days.indexOf(day)+1;
  const g=gmKey(sc);
  const base=(sc?.sp||[]).filter(x=>x.k!==ALL).concat(ALLSP);
  const parts=[];
  for(const s of ss){
    const snap=await S.db.collection(`sessions/${s.id}/chunks`).get();
    const bl=snap.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i).flatMap(c=>c.b||[]);
    parts.push({part:s.part,bl,sp:base.concat((s.sp||[]).filter(o=>!base.some(x=>x.k===o.k)))});
  }
  const title=`${scen} ${nth}회차`;
  // 같은 사람이 이어서 말하면 이름은 한 번만, 대사는 줄바꿈으로 붙여요
  const lines=(bl,sp)=>{
    const out=[];let i=0;
    while(i<bl.length){
      const b=bl[i];
      if(b.s===NOTE){out.push(`<p class="note">${esc(b.x).replace(/\n/g,"<br>")}</p>`);i++;continue;}
      if(b.s===HAND){out.push(`<div class="hand"><div class="hlab">핸드아웃</div>${esc(b.x).replace(/\n/g,"<br>")}</div>`);i++;continue;}
      if(b.s===DICE){
        const p=b.w?(sp.find(z=>z.k===b.w)||{name:"?",c:"#888"}):null,c=p?fixC(p.c):"#8a8178";
        out.push(`<p class="dice" style="color:${c};--c:${c}">🎲 ${p?`<span class="nm"><b>${esc(p.ch||p.name)}</b></span> : `:""}<span class="tx">${b.x?esc(b.x)+" ":""}${b.r?`<span class="dr">${esc(b.r)}</span>`:""}</span>${b.sec?` <span class="res secret">Secret Dice</span>`:""}${b.o&&OUT[b.o]?` <span class="res ${b.o}">${OUT[b.o]}</span>`:""}</p>`);
        i++;continue;}
      const run=[];while(i<bl.length&&bl[i].s===b.s){run.push(bl[i].x);i++;}
      const p=sp.find(z=>z.k===b.s)||{name:"?",c:"#888"};
      const c=fixC(p.c),gm=b.s===g;
      const nm=`<b>${esc(p.name)}</b>${p.ch?`<small> ${esc(p.ch)}</small>`:""}`;
      const x=run.map(t=>esc(t).replace(/\n/g,"<br>")).join("<br>");
      out.push(`<p${gm?' class="gm"':""} style="color:${c};--c:${c}"><span class="nm">${gm?'<span class="gmt">GM</span>':""}${nm}</span> : <span class="tx">${x}</span></p>`);
    }
    return out.join("\n");
  };
  const body=parts.map(p=>(parts.length>1?`<h2>${p.part}부</h2>`:"")+lines(p.bl,p.sp)).join("\n");
  return `<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
<title>${esc(title)}</title>
<style>
body{margin:0;background:#fff;color:#222;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7}
main{max-width:860px;margin:0 auto;padding:28px 20px 60px}
header{border-bottom:1px solid #ddd;margin-bottom:18px;padding-bottom:10px}
header h1{font-size:20px;margin:0}header div{color:#888;font-size:13px}
h2{font-size:14px;color:#999;font-weight:600;text-align:center;margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2:before,h2:after{content:"";flex:1;border-top:1px solid #e3e3e3}
p{margin:0;padding:6px 2px;border-bottom:1px solid #ece7df;word-break:keep-all;overflow-wrap:anywhere}
.nm b{font-weight:700}.nm small{font-size:12px;font-weight:400;opacity:.85}
.gm{background:#faf6ee;border-left:3px solid currentColor;padding:6px 8px}
.gm .tx{color:#3a2e22}
.gmt{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--c);border-radius:3px;padding:0 4px;margin-right:5px;vertical-align:2px;line-height:15px}
.note{color:#8a8178;font-style:italic;text-align:center;padding:10px 2px}
.hand{font-family:"Gowun Batang",serif;background:#fbf5e6;border:1px solid #e2d3b0;border-radius:6px;padding:12px 18px 14px;margin:12px 0;color:#3a2e22;font-size:15.5px;line-height:1.85}
.hand .hlab{font-family:sans-serif;font-size:10.5px;letter-spacing:1.5px;color:#a08660;margin-bottom:4px}
.dice{background:#f7f5f0;border-left:3px solid var(--c);padding:6px 8px}
.dice .tx{color:#3a2e22}.dice .dr{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
.res{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:4px;padding:0 7px;margin-left:4px;line-height:18px;vertical-align:1px}
.res.secret{background:#3a2e4a}.res.success{background:#3f7a3a}.res.failure{background:#8a8178}.res.critical{background:#c08a14}.res.fumble{background:#a83a2a}
</style></head><body><main>
<header><h1>${esc(title)}</h1><div>${esc(fmtDay(day))}${sc?.system?" · "+esc(sc.system):""}</div></header>
${body}
</main></body></html>`;
}
async function exportDay(scen,day){
  toast("HTML 만드는 중…");
  try{
    const html=await buildDayHTML(scen,day);
    const days=[...new Set(S.sessions.map(info).filter(i=>i.scen===scen).map(i=>i.day))].sort();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    a.download=`${scen} ${days.indexOf(day)+1}회차.html`.replace(/[\\/:*?"<>|]/g,"_");
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){toast("내보내기에 실패했어요: "+(e.code||e.message||e),3500);}
}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-exps]");if(!b)return;ev.preventDefault();ev.stopPropagation();exportDay(b.dataset.exps,b.dataset.expd);},true);

// ---------- rendering ----------
function render(){
  const app=$("#app");
  refreshCanWrite();
  if(S.cid){app.innerHTML=scenHTML();bindScen();return;}
  if(!S.sid){app.innerHTML=homeHTML();bindHome();return;}
  app.innerHTML=`
  <header id="hdr"></header>
  <div class="wrap ${S.canWrite?"":"ro"}">
    <aside id="side"></aside>
    <main>
      <div class="tools">
        <input type="search" id="q" placeholder="검색 (예: NPC 이름, 단서)" value="${esc(S.q)}">
        <span class="status" id="qcount"></span>
        <button class="ghost" id="copyAll" title="보이는 로그를 텍스트로 복사">텍스트 복사</button>

let _nre={k:null,re:null};
function nounRe(){
  const list=S.meta?[...new Set(nouns())].filter(Boolean).sort((a,b)=>b.length-a.length):[];
  const k=list.join("\u0001");
  if(_nre.k!==k)_nre={k,re:list.length?new RegExp(list.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"g"):null};

}
function hlq(h){
  if(S.q){const q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");h=h.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`);}
  return h;
}
function hl(text){
  const re=nounRe();
  if(re){let out="",last=0;text=String(text);re.lastIndex=0;let m;
    while((m=re.exec(text))){out+=hlq(esc(text.slice(last,m.index)))+`<span class="nb">${hlq(esc(m[0]))}</span>`;last=m.index+m[0].length;}
    return out+hlq(esc(text.slice(last)));}
  let h=esc(text);
  if(S.q){const q=esc(S.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");h=h.replace(new RegExp(q,"gi"),m=>`<mark>${m}</mark>`);}

}

// ---------- text editing ----------
function editRow(id){
  if(!S.canWrite)return;
  if(S.follow&&S.audioUrl&&!$("#aud").paused)setFollow(false);
  const r=document.querySelector(`.row[data-id="${id}"]`);const e=S.byId.get(id);if(!r||!e)return;
  select(id,false);
  const tx=r.querySelector(".tx");
  if(e.b.s===DICE){editDice(r,e);return;}
  const isNote=e.b.s===NOTE,isHand=e.b.s===HAND;
  r.classList.add("editing");
  tx.innerHTML=`<textarea placeholder="${isNote?"예: 아래층에서 소음이 들린다":isHand?"핸드아웃 내용":""}">${esc(e.b.x)}</textarea><div class="edhint">${isNote?"Enter 저장 · Esc 취소":isHand?"Ctrl+Enter 저장 · Esc 취소":"줄바꿈으로 나눌 곳을 만든 뒤 ✂로 나눌 수 있어요 · Ctrl+Enter 저장 · Esc 취소"}</div>`;
  const ta=tx.querySelector("textarea");ta.style.height=Math.max(isNote?44:60,ta.scrollHeight+4)+"px";ta.focus();
  let done=false;
  const finish=save=>{if(done)return;done=true;
    if(save)setText(id,ta.value);
    else if((isNote||isHand)&&!e.b.x){const x=S.byId.get(id);if(x){S.undo.pop();doOps([{ci:x.ci,op:{t:"del",id}}],null);renderAllRows(true);}return;}
    if(S.byId.has(id)){updateRow(id);select(id,false);}};
  ta.onkeydown=ev=>{if(ev.key==="Escape"){ev.preventDefault();finish(false);}if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey||(isNote&&!ev.shiftKey))){ev.preventDefault();finish(true);}ev.stopPropagation();};
  ta.onblur=()=>{if(S.rerendering)return;setTimeout(()=>{if(document.activeElement!==ta&&ta.isConnected)finish(true);else if(!ta.isConnected&&!S.byId.has(id))finish(false);},0);};
}

function editDice(r,e){
  const id=e.b.id,b=e.b,tx=r.querySelector(".tx");
  r.classList.add("editing");
  let o=b.o||"",sec=!!b.sec;
  const opts=spList().map(p=>`<option value="${p.k}"${p.k===b.w?" selected":""}>${p.ch?esc(p.ch)+" ("+esc(p.name)+")":esc(p.name)}</option>`).join("");
  tx.innerHTML=`<div class="dform">
    <select data-f="w"><option value="">인물 고르기</option>${opts}</select>
    <input data-f="x" type="text" placeholder="판정 (선택) 예: 지각" value="${esc(b.x||"")}">
    <input data-f="r" type="text" placeholder="결과 예: 1d20+3 → 17" value="${esc(b.r||"")}">
    <span class="dos"><button type="button" class="dres secret${sec?" on":""}" data-sec title="결과를 몰라도 돼요">Secret Dice</button>${Object.entries(OUT).map(([k,v])=>`<button type="button" class="dres ${k}${o===k?" on":""}" data-o="${k}">${v}</button>`).join("")}</span>
    <button type="button" class="pri" data-f="ok">저장</button><button type="button" data-f="no">취소</button>
  </div><div class="edhint">Enter 저장 · Esc 취소 · 성공 여부는 다시 누르면 해제돼요</div>`;
  const f=k=>tx.querySelector(`[data-f="${k}"]`);
  tx.querySelector("[data-sec]").onclick=ev=>{sec=!sec;ev.currentTarget.classList.toggle("on",sec);};
  tx.querySelectorAll("[data-o]").forEach(x=>x.onclick=()=>{o=o===x.dataset.o?"":x.dataset.o;tx.querySelectorAll("[data-o]").forEach(y=>y.classList.toggle("on",y.dataset.o===o));});
  let done=false;
  const finish=save=>{if(done)return;done=true;
    const v={w:f("w").value,x:f("x").value.trim(),r:f("r").value.trim(),o,sec};
    const empty=!v.x&&!v.r&&!v.o&&!v.sec,wasEmpty=!b.x&&!b.r&&!b.o&&!b.sec;
    if((save&&empty)||(!save&&wasEmpty)){const x=S.byId.get(id);if(x){if(wasEmpty&&S.undo.length&&S.undo[S.undo.length-1].label==="주사위 추가")S.undo.pop();doOps([{ci:x.ci,op:{t:"del",id}}],wasEmpty?null:"삭제");renderAllRows(true);}return;}
    if(save&&(v.w!==(b.w||"")||v.x!==(b.x||"")||v.r!==(b.r||"")||v.o!==(b.o||"")||v.sec!==!!b.sec))doOps([{ci:e.ci,op:{t:"set",id,f:v}}],"주사위 수정");
    if(S.byId.has(id)){updateRow(id);select(id,false);}};
  f("ok").onclick=()=>finish(true);f("no").onclick=()=>finish(false);
  tx.onkeydown=ev=>{if(ev.key==="Escape"){ev.preventDefault();finish(false);}else if(ev.key==="Enter"&&!ev.target.matches("button")){ev.preventDefault();finish(true);}ev.stopPropagation();};
  tx.onclick=ev=>ev.stopPropagation();
  (b.w?f("r"):f("w")).focus();
}

// ---------- 고유명사: 드래그한 글자를 등록된 이름으로 바꾸기 ----------
// 고유명사 묶음: {n:풀네임, a:[유의어...]} · PC 캐릭터 이름은 자동으로 들어가요
const normNoun=x=>typeof x==="string"?{n:x,a:[]}:{n:x.n,a:x.a||[]};
function nounGroups(){
  const sc=curScen();if(!sc)return [];
  const st=(sc.nouns||[]).map(normNoun);
  const pcs=[...new Set((sc.sp||[]).filter(p=>p.ch&&p.k!==ALL).map(p=>p.ch.trim()).filter(Boolean))];
  return [...pcs.map(n=>({...(st.find(g=>g.n===n)||{n,a:[]}),pc:true})),...st.filter(g=>!pcs.includes(g.n))];
}
const nouns=()=>nounGroups().flatMap(g=>[g.n,...g.a]);
// oldN의 묶음을 g로 바꾸기 (g=null이면 지우기, oldN=null이면 새로 추가)
function saveNoun(oldN,g){
  const sc=curScen();if(!sc)return;
  if(g){g={n:g.n.trim(),a:[...new Set(g.a.map(x=>x.trim()).filter(x=>x&&x!==g.n.trim()))]};if(!g.n)return;}
  mutateScen(sc.id,d=>{
    const arr=(d.nouns||[]).map(normNoun);const i=oldN==null?-1:arr.findIndex(x=>x.n===oldN);
    if(!g){if(i>=0)arr.splice(i,1);}
    else{const j=arr.findIndex(x=>x.n===g.n);
      if(i>=0){arr[i]=g;if(j>=0&&j!==i)arr.splice(j,1);}
      else if(j>=0)arr[j]={n:g.n,a:[...new Set([...arr[j].a,...g.a])]};
      else arr.push(g);}
    d.nouns=arr.filter(x=>x.a.length||!(d.sp||[]).some(p=>p.ch&&p.ch.trim()===x.n));
  });
  renderSide();renderAllRows(true);
}
function addAlias(full,word){const g=nounGroups().find(x=>x.n===full);if(!g)return;saveNoun(g.n,{n:g.n,a:[...g.a,word]});}
function nounEdit(anchor,full){
  const g=full==null?{n:"",a:[]}:nounGroups().find(x=>x.n===full);if(!g)return;
  popAt(anchor,`<div class="nedit">
    <label>풀네임${g.pc?' <span class="pct">PC · 캐릭터 이름에서 자동</span>':""}</label>
    <input type="text" id="nfull" value="${esc(g.n)}" ${g.pc?"disabled":""} placeholder="예: 세미야 신페이">
    <label>유의어 · 쉼표로 구분</label>
    <input type="text" id="nalt" value="${esc(g.a.join(", "))}" placeholder="예: 신페이, 세미야">
    <div class="btns">${full!=null&&!g.pc?'<button data-a="del" style="color:var(--bad)">지우기</button>':""}<button class="pri" data-a="ok">저장</button></div></div>`,p=>{
    const f=$("#nfull",p),a=$("#nalt",p);
    const ok=()=>{const n=g.pc?g.n:f.value.trim();if(!n){toast("풀네임을 넣어 주세요");return;}
      if(full==null&&nounGroups().some(x=>x.n===n)){toast("이미 있는 고유명사예요");return;}
      saveNoun(full,{n,a:a.value.split(/[,，]/)});closePop();};
    [f,a].forEach(i=>i.onkeydown=ev=>{ev.stopPropagation();if(ev.key==="Enter")ok();if(ev.key==="Escape")closePop();});
    p.querySelector("[data-a=ok]").onclick=ok;
    const d=p.querySelector("[data-a=del]");if(d)d.onclick=()=>{closePop();confirmBox(`'${g.n}' 묶음을 지울까요?`,"지우기",()=>saveNoun(g.n,null));};
    setTimeout(()=>(g.pc?a:f).focus(),0);
  });
}
function selInfo(){
  const sel=getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const r=sel.getRangeAt(0);
  const ln=n=>(n.nodeType===1?n:n.parentElement)?.closest(".ln");
  const a=ln(r.startContainer),z=ln(r.endContainer);
  if(!a||a!==z)return null;
  const row=a.closest(".row");if(!row||row.classList.contains("editing"))return null;
  const e=S.byId.get(row.dataset.id);if(!e||e.b.s===DICE)return null;
  const li=[...row.querySelectorAll(".ln")].indexOf(a);
  const pre=document.createRange();pre.selectNodeContents(a);pre.setEnd(r.startContainer,r.startOffset);
  let st=pre.toString().length,en=st+r.toString().length;
  const line=(e.b.x.split("\n")[li])||"";
  while(st<en&&/\s/.test(line[st]))st++;while(en>st&&/\s/.test(line[en-1]))en--;
  if(en<=st)return null;
  return {id:e.b.id,li,st,en,word:line.slice(st,en),rect:r.getBoundingClientRect()};
}
function replaceAt(si,to){
  const e=S.byId.get(si.id);if(!e)return;
  const lines=e.b.x.split("\n");const l=lines[si.li];
  if(l==null||l.slice(si.st,si.en)!==si.word){toast("그 사이에 글이 바뀌었어요. 다시 골라 주세요");return;}
  lines[si.li]=l.slice(0,si.st)+to+l.slice(si.en);
  doOps([{ci:e.ci,op:{t:"set",id:si.id,f:{x:lines.join("\n")}}}],"고유명사 바꾸기");
  updateRow(si.id);toast(`'${si.word}' → '${to}'`);
}
function nounMenu(si){
  const gs=nounGroups(),known=nouns().includes(si.word);
  popAt({getBoundingClientRect:()=>si.rect},`<div class="tip" style="padding:2px 8px 4px">'${esc(si.word)}'을(를) 바꾸기</div>
    ${gs.length?gs.map(g=>`<div class="ngrp">${[g.n,...g.a].map((w,i)=>`<button data-n="${esc(w)}" class="${i?"alt":"full"}">${esc(w)}</button>`).join("")}${g.pc?'<span class="pct">PC</span>':""}</div>`).join(""):'<div class="tip" style="padding:2px 8px">아직 등록된 고유명사가 없어요</div>'}
    <hr><input type="text" id="nnew" placeholder="새 풀네임 입력 후 Enter (목록에도 추가)">
    ${known?"":`<div class="nreg"><span>'${esc(si.word)}' 등록:</span><select id="nto"><option value="">새 고유명사(풀네임)로</option>${gs.map(g=>`<option value="${esc(g.n)}">${esc(g.n)}의 유의어로</option>`).join("")}</select><button data-reg>등록</button></div>`}`,p=>{
    p.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{closePop();getSelection().removeAllRanges();replaceAt(si,b.dataset.n);});
    const inp=$("#nnew",p);inp.onkeydown=ev=>{ev.stopPropagation();if(ev.key==="Enter"){const v=inp.value.trim();if(!v)return;closePop();if(!nounGroups().some(x=>x.n===v))saveNoun(null,{n:v,a:[]});replaceAt(si,v);}if(ev.key==="Escape")closePop();};
    const rg=p.querySelector("[data-reg]");if(rg)rg.onclick=()=>{const to=$("#nto",p).value;closePop();if(to)addAlias(to,si.word);else saveNoun(null,{n:si.word,a:[]});toast("등록했어요");};
    const sl=$("#nto",p);if(sl)sl.onkeydown=ev=>ev.stopPropagation();
  });
}
document.addEventListener("mouseup",ev=>{
  if(!S.canWrite||!curScen()||!ev.target.closest||!ev.target.closest("#log"))return;
  setTimeout(()=>{const si=selInfo();if(si)nounMenu(si);},0);

// ---------- audio ----------
function bindAudio(a){
  a.addEventListener("timeupdate",onTime);
  a.addEventListener("play",syncPlayer);a.addEventListener("pause",syncPlayer);a.addEventListener("loadedmetadata",syncPlayer);
}
function syncPlayer(){syncJump();
  const a=$("#aud");if(!a||!$("#pp"))return;
  $("#pp").textContent=a.paused?"▶":"❚❚";
  if(S.audioUrl){$("#tm").textContent=fmt(a.currentTime)+" / "+fmt(a.duration||0);if(a.duration)$("#seek").value=Math.round(a.currentTime/a.duration*1000);}
}
function onTime(){
  const a=$("#aud");syncPlayer();
  if(!S.flat.length)return;
  const t=a.currentTime;let lo=0,hi=S.flat.length-1,ans=-1;
  while(lo<=hi){const m=(lo+hi)>>1;if(S.flat[m].b.t<=t){ans=m;lo=m+1;}else hi=m-1;}
  // first block of that timestamp group
  if(ans>=0){const tt=S.flat[ans].b.t;while(ans>0&&S.flat[ans-1].b.t===tt)ans--;}
  const id=ans>=0?S.flat[ans].b.id:null;
  if(id!==S.playingId){
    const p=S.playingId&&document.querySelector(`.row[data-id="${S.playingId}"]`);p&&p.classList.remove("playing");
    S.playingId=id;
    const r=id&&document.querySelector(`.row[data-id="${id}"]`);
    if(r){r.classList.add("playing");if(S.follow&&!a.paused&&!document.activeElement?.matches("textarea"))r.scrollIntoView({block:"center",behavior:"smooth"});}
    syncJump();
  }
}
function setFollow(v){S.follow=v;const f=$("#follow");if(f)f.checked=v;syncJump();}
function syncJump(){const j=$("#jump"),a=$("#aud");if(j)j.classList.toggle("hidden",S.follow||!S.audioUrl||!a||a.paused);}
// 사용자가 직접 스크롤하면 따라가기를 끔
["wheel","touchmove"].forEach(ev=>window.addEventListener(ev,()=>{const a=$("#aud");if(S.follow&&a&&!a.paused&&S.audioUrl)setFollow(false);},{passive:true}));
function playAt(t){
  const a=$("#aud");
  if(!S.audioUrl){toast("먼저 위에서 녹음 파일을 열어 주세요");return;}
  a.currentTime=Math.max(0,t-0.5);a.play().catch(()=>{});
}
function togglePlay(){const a=$("#aud");if(!S.audioUrl)return;a.paused?a.play().catch(()=>{}):a.pause();}

  const ua=$("#upaudio");if(ua)ua.onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const s=S.sessions.find(x=>x.id===S.sid)||{id:S.sid,...S.meta};
    try{await uploadAudio(s,f,pct=>{const c=document.querySelector(".player .filebtn button");if(c)c.textContent=`올리는 중 ${pct}%`;});toast("녹음을 올렸어요");}catch(e){toast("올리지 못했어요: "+(e.code||e.message),4000);renderHeader();}};
  if($("#afile"))$("#afile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(S.audioUrl&&!S.audioCloud)URL.revokeObjectURL(S.audioUrl);S.audioCloud=false;S.audioUrl=URL.createObjectURL(f);const a=$("#aud");a.src=S.audioUrl;renderHeader();toast("녹음을 열었어요. 시간을 누르면 거기서 재생돼요");};
  $("#pp").onclick=togglePlay;

  $("#fw").onclick=()=>{const a=$("#aud");a.currentTime=a.currentTime+5;};

  $("#jump").onclick=()=>{setFollow(true);const r=S.playingId&&document.querySelector(`.row[data-id="${S.playingId}"]`);r&&r.scrollIntoView({block:"center",behavior:"smooth"});};

document.addEventListener("keydown",ev=>{
  if(!S.sid&&!S.local)return;
  if(ev.target.matches("input,textarea,select")||document.querySelector(".modal"))return;
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="z"){if(S.canWrite){ev.preventDefault();undo();}return;}
  if(ev.ctrlKey||ev.metaKey||ev.altKey)return;
  const k=ev.key;
  if(k==="ArrowDown"||k==="j"){ev.preventDefault();moveSel(1);}
  else if(k==="ArrowUp"||k==="k"){ev.preventDefault();moveSel(-1);}
  else if(k===" "){ev.preventDefault();togglePlay();}
  else if(k==="Escape"){closePop();}
  else if(k==="["){const a=$("#aud");a&&(a.currentTime=Math.max(0,a.currentTime-5));}
  else if(k==="]"){const a=$("#aud");a&&(a.currentTime+=5);}
  else if(!S.sel)return;
  else if(/^[1-9]$/.test(k)&&S.canWrite){const s=shownSp()[+k-1];if(s){assign(S.sel,s.k);}}
  else if(k==="0"&&S.canWrite&&S.sel){assign(S.sel,ALL);}
  else if(k==="Enter"){ev.preventDefault();editRow(S.sel);}
  else if((k==="n"||k==="N"||k==="ㅜ")&&S.canWrite){ev.preventDefault();addNote(S.sel);}
  else if((k==="d"||k==="D"||k==="ㅇ")&&S.canWrite){ev.preventDefault();addDice(S.sel);}
  else if((k==="h"||k==="H"||k==="ㅗ")&&S.canWrite){ev.preventDefault();addHand(S.sel);}
  else if(k==="p"||k==="P"){const e=S.byId.get(S.sel);e&&playAt(e.b.t);}
});

// ---------- scenario / date grouping ----------
function guessInfo(title,dateLine){
  title=String(title||"").trim();
  let day="",scen=title,part=null,m;
  if((m=title.match(/^(\d{2})(\d{2})(\d{2})\s+(.+)$/))){day=`20${m[1]}-${m[2]}-${m[3]}`;scen=m[4];}
  else if((m=String(dateLine||"").match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})/))){day=`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;}
  if((m=scen.match(/^(.+?)\s*[-_#(]?\s*(\d{1,2})\s*\)?\s*(?:부|편|파트)?$/))){scen=m[1].trim();part=+m[2];}
  return {scen:scen||"이름 없는 시나리오",day,part:part||1};
}
function info(s){const g=guessInfo(s.title,s.date);return {scen:resolveScen(s.scen||g.scen),day:s.day||g.day,part:s.part||g.part};}
const normName=n=>String(n||"").replace(/[\s·._\-:~!?'"()\[\]]/g,"").toLowerCase();
function findScen(name){
  if(!name)return null;
  const n=normName(name);
  return S.scens.find(x=>x.name===name)||S.scens.find(x=>(x.aliases||[]).includes(name))
    ||S.scens.find(x=>normName(x.name)===n||(x.aliases||[]).some(a=>normName(a)===n))||null;
}
function resolveScen(name){return findScen(name)?.name||name;}
const WD="일월화수목금토";
function fmtDay(d){if(!d)return "날짜 없음";const [y,m,dd]=d.split("-").map(Number);const dt=new Date(y,m-1,dd);return `${y===new Date().getFullYear()?"":y+"년 "}${m}월 ${dd}일 (${WD[dt.getDay()]})`;}
function groups(){
  const by={};
  S.sessions.forEach(s=>{const i=info(s);(by[i.scen]=by[i.scen]||{scen:i.scen,days:{}});(by[i.scen].days[i.day]=by[i.scen].days[i.day]||[]).push({...s,...i});});
  S.scens.forEach(sc=>{if(!by[sc.name])by[sc.name]={scen:sc.name,days:{}};});
  return Object.values(by).map(g=>{
    const days=Object.keys(g.days).sort().map(d=>({day:d,parts:g.days[d].sort((a,b)=>a.part-b.part)}));
    const sc=scenByName(g.scen);
    // 로그가 잠겨 있어도 정렬이 같도록, 주인이 시나리오 문서에 적어둔 마지막 플레이 날짜를 써요
    return {scen:g.scen,sc,days,last:days.length?days[days.length-1].day:(sc?.lastDay||(sc?new Date(sc.created||0).toISOString().slice(0,10):""))};
  }).sort((a,b)=>b.last.localeCompare(a.last)||a.scen.localeCompare(b.scen,"ko"));
}
function siblings(){
  if(!S.meta)return [];const me=info(S.meta);
  return S.sessions.filter(s=>{const i=info(s);return i.scen===me.scen&&i.day===me.day;}).map(s=>({...s,...info(s)})).sort((a,b)=>a.part-b.part);
}
function dayIndex(){ // 몇 회차인지
  if(!S.meta)return 0;const me=info(S.meta);
  const days=[...new Set(S.sessions.map(info).filter(i=>i.scen===me.scen).map(i=>i.day))].sort();

async function loadCloudAudio(){

  const sid=S.sid;S.audioLoading=true;renderHeader();
  try{
    const url=await S.storage.ref(S.meta.audioPath).getDownloadURL();

    S.audioUrl=url;S.audioCloud=true;const a=$("#aud");if(a)a.src=url;
  }catch(e){toast("녹음을 불러오지 못했어요: "+(e.code||e.message),4000);}

function uploadAudio(sess,file,onPct){
  return new Promise((ok,fail)=>{
    if(!S.storage){fail(new Error("Storage가 설정되지 않았어요"));return;}
    const scid=sess.scid||findScen(info(sess).scen)?.id;if(!scid){fail(new Error("시나리오를 찾을 수 없어요"));return;}
    const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[,"m4a"])[1].toLowerCase();
    const path=`audio/${scid}/${sess.id}.${ext}`;
    const task=S.storage.ref(path).put(file,{contentType:file.type||(ext==="m4a"?"audio/mp4":"audio/"+ext)});
    task.on("state_changed",sn=>onPct&&onPct(Math.floor(sn.bytesTransferred/sn.totalBytes*100)),fail,async()=>{
      try{
        if(sess.audioPath&&sess.audioPath!==path){try{await S.storage.ref(sess.audioPath).delete();}catch(e){}}
        await S.db.doc("sessions/"+sess.id).update({audioPath:path,audioName:file.name,audioSize:file.size});ok(path);
      }catch(e){fail(e);}
    });
  });
}
async function removeAudio(sess){
  if(sess.audioPath){try{await S.storage.ref(sess.audioPath).delete();}catch(e){}}
  await S.db.doc("sessions/"+sess.id).update({audioPath:firebase.firestore.FieldValue.delete(),audioName:firebase.firestore.FieldValue.delete(),audioSize:firebase.firestore.FieldValue.delete()});
}

    let n=0;const total=data.scenarios.length+data.sessions.reduce((a,s)=>a+1+(s.chunks||[]).length,0);
    let batch=S.db.batch(),inBatch=0;
    const put=async(path,body)=>{batch.set(S.db.doc(path),body);inBatch++;n++;if(inBatch>=400){prog(`가져오는 중… ${n}/${total}`);await retry(()=>batch.commit());batch=S.db.batch();inBatch=0;}};
    for(const sc of data.scenarios){const {id,...b}=sc;await put("scenarios/"+id,b);}
    for(const se of data.sessions){
      const {id,chunks,...b}=se;await put("sessions/"+id,b);
      for(const c of chunks||[]){const {id:cid,...cb}=c;await put(`sessions/${id}/chunks/${cid}`,cb);}
    }
    if(inBatch)await retry(()=>batch.commit());
    S.impMsg=`완료! 시나리오 ${data.scenarios.length}개, 녹음 ${data.sessions.length}개를 가져왔어요`;
  }catch(e){S.impMsg="가져오다가 멈췄어요: "+(e.code||e.message)+" · 다시 가져오면 처음부터 덮어써요";}
  S.importing=false;render();
}
async function exportAll(prog){
  const out={format:"trpg-log",version:1,exported:new Date().toISOString(),scenarios:[],sessions:[]};
  const scs=await S.db.collection("scenarios").get();
  scs.docs.forEach(d=>out.scenarios.push({id:d.id,...d.data()}));
  const ss=await S.db.collection("sessions").get();
  let i=0;
  for(const d of ss.docs){
    i++;prog&&prog(`읽는 중… ${i}/${ss.docs.length}`);
    const ch=await S.db.collection(`sessions/${d.id}/chunks`).get();
    out.sessions.push({id:d.id,...d.data(),chunks:ch.docs.map(c=>({id:c.id,...c.data()}))});
  }
  return out;
}

function buildSession(r,inf){
  const sp=[],map={};
  r.blocks.forEach(b=>{if(!map[b.s]){const k="k"+rid();map[b.s]=k;sp.push({k,name:b.s,c:COLORS[sp.length%COLORS.length]});}});
  const all=r.blocks.map(b=>({id:rid(),s:map[b.s],t:b.t,x:b.x}));
  const cnt={};all.forEach(b=>cnt[b.s]=(cnt[b.s]||0)+1);sp.sort((a,b)=>cnt[b.k]-cnt[a.k]);
  const chunks=[];for(let i=0;i<all.length;i+=CHUNK)chunks.push(all.slice(i,i+CHUNK));
  return {meta:{title:r.title,date:r.dateLine,created:Date.now(),n:all.length,sp,...(inf||guessInfo(r.title,r.dateLine))},chunks};
}
