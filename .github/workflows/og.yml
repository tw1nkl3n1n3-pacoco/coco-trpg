name: 공유 미리보기 갱신
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/og.mjs", ".github/workflows/og.yml"]
permissions:
  contents: write
concurrency: og
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/og.mjs
      - run: |
          git config user.name "og-bot"
          git config user.email "og-bot@users.noreply.github.com"
          git add -A p index.html
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -m "공유 미리보기 갱신" && git push; fi
